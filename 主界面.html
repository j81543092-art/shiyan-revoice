<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拾言 ReVoice · 我想说</title>
<style>
:root{--bg:#F5F0E8;--card:#fff;--ink:#1A1A1A;--soft:#5F574A;--faint:#9A9388;--acc:#C06C2C;--accL:#D4792E;--acc2:#A85A1E;--accS:#F6E8D8;--accS2:#FBF2E8;--line:#E5E0D8;--dan:#D32F2F;--danL:#E53935;--dan2:#C62828;--danS:#FFEBEE}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% -8%,rgba(192,108,44,.1) 0%,transparent 42%),var(--bg);color:var(--ink);min-height:100vh;padding:24px 20px 48px;line-height:1.6}
.page{max-width:880px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px}
.topbar h1{font-size:34px;font-weight:800}
.topbar h1 em,.topbar h2 em{font-style:normal;color:var(--acc)}
.topbar h2{font-size:30px;font-weight:800}
.btn-back{font-size:19px;color:var(--acc);text-decoration:none;font-weight:600;padding:12px 18px;border-radius:14px;border:2px solid var(--accS);white-space:nowrap}
.btn-back:active{transform:scale(.95)}
.search-wrap{position:relative;margin-bottom:26px}
.search-input{width:100%;height:76px;border:2px solid var(--line);border-radius:18px;padding:0 76px 0 68px;font-size:23px;font-family:inherit;color:var(--ink);background:var(--card)}
.search-input::placeholder{color:var(--faint)}
.search-input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 5px var(--accS)}
.search-icon{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.voice-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:52px;height:52px;border:none;border-radius:50%;background:var(--accS);color:var(--acc);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .18s,transform .12s}
.voice-btn:hover{background:var(--accS2)}
.voice-btn:active{transform:translateY(-50%) scale(.92)}
.voice-btn.listening{background:var(--acc);color:#fff;animation:micPulse 1s infinite}
@keyframes micPulse{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.12)}}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cat-card{height:200px;border:2px solid var(--line);border-radius:22px;background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:border-color .18s,box-shadow .18s,transform .12s}
.cat-card:hover{border-color:var(--acc);box-shadow:0 14px 30px -16px rgba(26,26,26,.25)}
.cat-card:active{transform:scale(.97)}
.cat-card:focus-visible{outline:4px solid var(--accS);outline-offset:2px}
.cat-card .emoji{font-size:96px;line-height:1}
.cat-card .name{font-size:26px;font-weight:700}
.cat-card.urgent{border-color:var(--danL)}
.cat-card.urgent .name{color:var(--dan)}
.cat-card.urgent:hover{border-color:var(--dan);box-shadow:0 14px 30px -16px rgba(211,47,47,.3)}
.pager{display:flex;justify-content:center;align-items:center;gap:24px;margin-top:32px}
.pager button{width:72px;height:72px;border:2px solid var(--line);border-radius:50%;background:var(--card);color:var(--acc);font-size:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .18s,transform .12s,opacity .18s}
.pager button:hover{background:var(--accS2)}
.pager button:active{transform:scale(.93)}
.pager button:disabled{color:var(--faint);cursor:not-allowed;opacity:.5}
.dots{display:flex;gap:10px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.active{background:var(--acc)}
.phrases{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:28px}
.ph-card{position:relative;min-height:110px;border:2px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);font-size:26px;font-weight:600;font-family:inherit;cursor:pointer;padding:20px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;transition:border-color .18s,transform .12s,box-shadow .18s}
.ph-card .ph-icon{font-size:42px;line-height:1}
.ph-card.hint{border-color:var(--acc);box-shadow:0 0 0 4px var(--accS);animation:hintPulse 1.2s infinite}
@keyframes hintPulse{0%,100%{box-shadow:0 0 0 4px var(--accS)}50%{box-shadow:0 0 0 10px var(--accS2)}}
.ph-card.checked{border-color:var(--acc);background:var(--accS2);box-shadow:0 0 0 3px var(--accS)}
.ph-card .seq{position:absolute;top:5px;right:6px;font-size:15px;font-weight:700;color:#fff;background:var(--acc);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.ph-card:hover{border-color:var(--acc)}
.ph-card:active{transform:scale(.95)}
.ph-card.said{background:linear-gradient(135deg,var(--accL),var(--acc2));color:#fff;border-color:var(--acc)}
.ph-card.urgent{border-color:var(--danL);color:var(--dan)}
.ph-card.urgent.said{background:linear-gradient(135deg,var(--danL),var(--dan2));color:#fff;border-color:var(--dan)}
.selected-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:52px;padding:12px 18px;border-radius:16px;background:var(--accS2);border:2px solid var(--accS);margin-bottom:18px;font-size:20px}
.selected-bar .tag{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:12px;background:var(--card);border:2px solid var(--acc);font-size:20px;font-weight:600;color:var(--acc)}
.selected-bar .tag .x{cursor:pointer;color:var(--faint);font-size:16px;margin-left:4px}
.selected-bar .tag .x:hover{color:var(--dan)}
.selected-bar .ph{color:var(--soft);font-size:19px}
.confirm-bar{display:flex;gap:20px;margin-bottom:20px}
.btn-yes,.btn-no{flex:1;height:88px;border:none;border-radius:20px;font-size:30px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s,box-shadow .18s}
.btn-yes{background:linear-gradient(135deg,#4CAF50,#2E7D32);color:#fff}
.btn-no{background:linear-gradient(135deg,var(--accL),var(--acc2));color:#fff}
.btn-yes:active,.btn-no:active{transform:scale(.95)}
.btn-yes:hover{box-shadow:0 8px 24px -10px rgba(46,125,50,.5)}
.btn-no:hover{box-shadow:0 8px 24px -10px rgba(192,108,44,.5)}
.voice-confirm{width:100%;height:72px;border:2px solid var(--accS);border-radius:18px;background:var(--card);color:var(--acc);font-size:22px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .18s,transform .12s}
.voice-confirm:hover{background:var(--accS2)}
.voice-confirm:active{transform:scale(.97)}
.voice-confirm.listening{background:var(--acc);color:#fff;border-color:var(--acc)}
.empty{text-align:center;padding:60px 20px;color:var(--soft);font-size:21px}
.empty .big{font-size:28px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%) translateY(40px);background:var(--ink);color:#fff;font-size:21px;padding:20px 36px;border-radius:18px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
@media(max-width:560px){.cat-grid{grid-template-columns:1fr}.phrases{grid-template-columns:1fr 1fr}.cat-card{height:170px}.cat-card .emoji{font-size:80px}.ph-card .ph-icon{font-size:34px}.ph-card{min-height:96px;font-size:24px}.btn-yes,.btn-no{height:80px;font-size:26px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.cat-card:active,.ph-card:active,.pager button:active{transform:none}}
</style>
</head>
<body>
<main class="page">
<div class="topbar"><h1>我想说<em>…</em></h1></div>
<div class="search-wrap">
<input class="search-input" type="search" id="search" placeholder="搜索想说的话" aria-label="搜索框，输入关键词搜索常用语句">
<span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>

</div>
<div id="catView">
<div class="cat-grid" id="catGrid"></div>
<div class="pager">
<button id="prevBtn" aria-label="上一页">‹</button>
<div class="dots" id="dots"></div>
<button id="nextBtn" aria-label="下一页">›</button>
</div>
</div>
<div id="phraseView" class="hidden">
<div class="topbar"><a class="btn-back" href="#" id="backBtn">← 返回</a><h2 id="phraseTitle"></h2></div>
<div class="phrases" id="phraseGrid"></div>
<div class="selected-bar" id="selectedBar"><span class="ph">点击图标选择想说的话（可多选）</span></div>
<div id="confirmBar">
<div class="confirm-bar">
<button class="btn-yes" id="btnYes" aria-label="是，这里有我想说的话">是 ✓</button>
<button class="btn-no" id="btnNo" aria-label="不是，换一组">不是 ✗</button>
</div>
<button class="voice-confirm" id="voiceConfirm" aria-label="语音说是或不是" onclick="toggleVoiceConfirm()">🎤 语音说是 / 不是</button>
</div>
</div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function phCard(p,urgent){const ic=phraseIcons[p];return`<button class="ph-card${urgent?' urgent':''}" data-p="${p}" onclick="toggleSelect('${p}',this)" aria-label="选择：${p}">${ic?`<span class="ph-icon" aria-hidden="true">${ic}</span>`:''}${p}</button>`}
function toggleSelect(p,el){const i=selected.indexOf(p);if(i>=0){selected.splice(i,1);el.classList.remove('checked');const seq=el.querySelector('.seq');if(seq)seq.remove();refreshSeq()}else{selected.push(p);el.classList.add('checked');const s=document.createElement('span');s.className='seq';s.textContent=selected.length;s.setAttribute('aria-hidden','true');el.appendChild(s)}updateSelectedBar()}
function refreshSeq(){document.querySelectorAll('.ph-card.checked').forEach(c=>{const seq=c.querySelector('.seq');const p=c.getAttribute('data-p');const idx=selected.indexOf(p);if(seq)seq.textContent=idx+1})}
function updateSelectedBar(){const bar=$('selectedBar');if(!selected.length){bar.innerHTML='<span class="ph">点击图标选择想说的话（可多选）</span>';return}bar.innerHTML=selected.map((p,i)=>`<span class="tag">${p}<span class="x" onclick="removeSelected(${i})">✕</span></span>`).join('')}
function removeSelected(i){const p=selected[i];selected.splice(i,1);const card=document.querySelector('.ph-card[data-p="'+p+'"]');if(card){card.classList.remove('checked');const seq=card.querySelector('.seq');if(seq)seq.remove()}refreshSeq();updateSelectedBar()}
function saySelected(){if(!selected.length)return;const text=selected.join('，');showToast('已说出：'+text);if('speechSynthesis'in window){speechSynthesis.cancel();selected.forEach((p,idx)=>{setTimeout(()=>{const u=new SpeechSynthesisUtterance(p);u.lang='zh-CN';u.rate=.9;speechSynthesis.speak(u)},idx*1200)})}document.querySelectorAll('.ph-card.checked').forEach(c=>{c.classList.add('said');setTimeout(()=>c.classList.remove('said'),600);c.classList.remove('checked');const seq=c.querySelector('.seq');if(seq)seq.remove()});selected=[];updateSelectedBar()}
const PER=4;let page=0;let toastTimer=null;let curCat=-1;let phPage=0;let notCount=0;let recog2=null;let listening2=false;let selected=[];let searchMode=false;
const $=id=>document.getElementById(id);
function showToast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
function sayPhrase(text,card){showToast('已说出：'+text);if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.9;speechSynthesis.speak(u)}if(card){card.classList.add('said');setTimeout(()=>card.classList.remove('said'),600)}}
function renderCats(){const start=page*PER;const slice=categories.slice(start,start+PER);$('catGrid').innerHTML=slice.map((c,j)=>{const i=start+j;return`<button class="cat-card${c.urgent?' urgent':''}" onclick="openCat(${i})" aria-label="${c.name}"><span class="emoji" aria-hidden="true">${c.icon}</span><span class="name">${c.name}</span></button>`}).join('');const total=Math.ceil(categories.length/PER);$('dots').innerHTML=Array.from({length:total},(_,k)=>`<span class="dot${k===page?' active':''}"></span>`).join('');$('prevBtn').disabled=page===0;$('nextBtn').disabled=page>=total-1}
function openCat(i){curCat=i;phPage=0;notCount=0;searchMode=false;const c=categories[i];$('phraseTitle').innerHTML=`<em>${c.icon}</em> ${c.name}`;renderPhrases();$('confirmBar').classList.remove('hidden');$('catView').classList.add('hidden');$('phraseView').classList.remove('hidden');window.scrollTo(0,0)}
function renderPhrases(){selected=[];const c=categories[curCat];const s=phPage*6;const slice=c.phrases.slice(s,s+6);if(!slice.length){$('phraseGrid').innerHTML='<div class="empty"><div class="big">没有了</div>请返回选择其他分类</div>';return}$('phraseGrid').innerHTML=slice.map(p=>phCard(p,c.urgent)).join('');updateSelectedBar()}
function backToCat(){$('phraseView').classList.add('hidden');$('catView').classList.remove('hidden');$('search').value='';curCat=-1;phPage=0;notCount=0;selected=[];searchMode=false;window.scrollTo(0,0)}
$('backBtn').addEventListener('click',e=>{e.preventDefault();backToCat()});
$('btnYes').addEventListener('click',()=>{if(!selected.length){document.querySelectorAll('.ph-card').forEach(el=>el.classList.add('hint'));showToast('请先选择您想说的话');setTimeout(()=>document.querySelectorAll('.ph-card').forEach(el=>el.classList.remove('hint')),3000);return}saySelected()});
$('btnNo').addEventListener('click',()=>{if(searchMode){selected=[];document.querySelectorAll('.ph-card.checked').forEach(c=>{c.classList.remove('checked');const seq=c.querySelector('.seq');if(seq)seq.remove()});updateSelectedBar();showToast('已清空选择');return}notCount++;const c=categories[curCat];if(notCount>=2||phPage*6+6>=c.phrases.length){showToast('请重新选择分类');setTimeout(()=>backToCat(),800);return}phPage++;renderPhrases()});
function toggleVoiceConfirm(){const vb=$('voiceConfirm');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){showToast('当前浏览器不支持语音输入');return}if(listening2){recog2.stop();return}recog2=new SR();recog2.lang='zh-CN';recog2.continuous=false;recog2.interimResults=false;recog2.onstart=()=>{listening2=true;vb.classList.add('listening');showToast('请说"是"或"不是"…')};recog2.onend=()=>{listening2=false;vb.classList.remove('listening')};recog2.onerror=()=>{listening2=false;vb.classList.remove('listening')};recog2.onresult=e=>{let txt=e.results[0][0].transcript.trim();if(txt.includes('是')||txt.includes('对')||txt.includes('嗯')){$('btnYes').click()}else if(txt.includes('不')){$('btnNo').click()}else{showToast('没听清，请说"是"或"不是"')}};recog2.start()}
$('prevBtn').addEventListener('click',()=>{if(page>0){page--;renderCats()}});
$('nextBtn').addEventListener('click',()=>{if(page<Math.ceil(categories.length/PER)-1){page++;renderCats()}});
$('search').addEventListener('input',()=>{const q=$('search').value.trim();if(!q){backToCat();return}const seen=new Set();let results=[];categories.forEach(c=>c.phrases.forEach(p=>{if(!seen.has(p)&&fuzzyMatch(q,p)){seen.add(p);results.push({p,urgent:c.urgent})}}));$('phraseTitle').textContent='搜索：'+q;if(results.length){$('phraseGrid').innerHTML=results.map(r=>phCard(r.p,r.urgent)).join('')}else{$('phraseGrid').innerHTML='<div class="empty"><div class="big">没有找到</div>试试输入"喝水""疼"等词</div>'}searchMode=true;selected=[];updateSelectedBar();$('confirmBar').classList.remove('hidden');$('catView').classList.add('hidden');$('phraseView').classList.remove('hidden')});
let recog=null;let listening=false;
function levenshtein(a,b){const m=a.length,n=b.length;const d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]:Math.min(d[i-1][j-1]+1,d[i][j-1]+1,d[i-1][j]+1);return d[m][n]}
function fuzzyMatch(q,p){if(p.includes(q)||q.includes(p))return true;const qs=new Set(q),ps=new Set(p);let inter=0;qs.forEach(c=>{if(ps.has(c))inter++});if(inter>0&&inter/Math.max(qs.size,ps.size)>=.5)return true;if(levenshtein(q,p)<=Math.max(1,Math.floor(Math.max(q.length,p.length)/3)))return true;return false}
function toggleVoice(){const vb=$('voiceBtn');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){showToast('当前浏览器不支持语音输入');return}if(listening){recog.stop();return}recog=new SR();recog.lang='zh-CN';recog.continuous=false;recog.interimResults=true;recog.onstart=()=>{listening=true;vb.classList.add('listening');showToast('请说话…')};recog.onend=()=>{listening=false;vb.classList.remove('listening')};recog.onerror=()=>{listening=false;vb.classList.remove('listening')};recog.onresult=e=>{let txt='';for(let i=e.resultIndex;i<e.results.length;i++){txt+=e.results[i][0].transcript}$('search').value=txt;$('search').dispatchEvent(new Event('input'))};recog.start()}
renderCats();
