<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#5200FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="拾言">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>拾言 ReVoice · 离线</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #F8F6FF;
    color: #1A1A2E;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 24px;
    text-align: center;
  }
  .offline-card {
    background: #FFF;
    border-radius: 20px;
    padding: 48px 32px;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 2px 16px rgba(82, 0, 255, 0.08);
  }
  .offline-icon {
    font-size: 64px;
    margin-bottom: 20px;
    opacity: 0.6;
  }
  .offline-title {
    font-size: 22px;
    font-weight: 700;
    color: #5200FF;
    margin-bottom: 8px;
  }
  .offline-sub {
    font-size: 15px;
    color: #666;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  .offline-btn {
    display: inline-block;
    background: #5200FF;
    color: #FFF;
    border: none;
    border-radius: 12px;
    padding: 14px 36px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.2s;
  }
  .offline-btn:active {
    background: #4100D1;
  }
  .offline-footer {
    margin-top: 32px;
    font-size: 13px;
    color: #999;
  }
</style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon" aria-hidden="true">&#x1F310;</div>
    <h1 class="offline-title">当前离线</h1>
    <p class="offline-sub">
      拾言的部分功能需要网络连接。<br>
      请联网后重试。
    </p>
    <button class="offline-btn" onclick="location.reload()">重新连接</button>
  </div>
  <p class="offline-footer">拾言 ReVoice · 意图重建沟通助手</p>

<script>
// Service Worker 注册（离线页面也需要，以便下次在线时更新）
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
// 监听网络恢复后自动刷新
window.addEventListener('online', () => location.reload());
</script>
</body>
</html>
