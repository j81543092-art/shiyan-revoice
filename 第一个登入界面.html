<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拾言 ReVoice · 登入</title>
  <style>
    :root {
      --bg-page: #F5F0E8;
      --card: #FFFFFF;
      --ink: #1A1A1A;
      --ink-soft: #5F574A;
      --ink-faint: #9A9388;
      --accent: #C06C2C;
      --accent-light: #D4792E;
      --accent-2: #A85A1E;
      --accent-soft: #F6E8D8;
      --accent-softer: #FBF2E8;
      --input-bg: #FAF8F5;
      --inactive-bg: #F0EBE3;
      --line: #E5E0D8;
      --shadow: 0 24px 60px -22px rgba(26, 26, 26, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      background:
        radial-gradient(circle at 50% -8%, rgba(192, 108, 44, 0.10) 0%, transparent 42%),
        var(--bg-page);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      line-height: 1.6;
    }

    .page { width: 100%; max-width: 880px; }

    .card {
      position: relative;
      background: linear-gradient(180deg, #FFFFFF 0%, #FFFBF4 100%);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 56px 52px 44px;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent-2) 100%);
    }

    .read-btn {
      position: absolute;
      top: 22px;
      right: 22px;
      width: 56px;
      height: 56px;
      border: 2px solid var(--accent-soft);
      border-radius: 50%;
      background: var(--accent-softer);
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      transition: background 0.18s, color 0.18s, transform 0.12s, border-color 0.18s;
    }
    .read-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .read-btn:active { transform: scale(0.92); }
    .read-btn:focus-visible { outline: 4px solid var(--accent-soft); outline-offset: 2px; }
    .read-btn.reading {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      animation: readPulse 1.3s infinite;
    }
    @keyframes readPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192, 108, 44, 0.45); }
      50% { box-shadow: 0 0 0 10px rgba(192, 108, 44, 0); }
    }

    .brand { text-align: center; margin-bottom: 28px; }
    .logo { width: 84px; height: 84px; margin: 0 auto 22px; }
    .kicker {
      font-size: 19px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 14px;
      letter-spacing: 2px;
    }
    .brand h1 {
      font-size: 40px;
      font-weight: 800;
      line-height: 1.32;
      color: var(--ink);
      margin-bottom: 18px;
    }
    .brand h1 em { font-style: normal; color: var(--accent); }
    .brand .desc {
      font-size: 18px;
      color: var(--ink-soft);
      line-height: 1.75;
      max-width: 620px;
      margin: 0 auto;
    }

    .mode-switch {
      display: flex;
      background: var(--inactive-bg);
      border-radius: 18px;
      padding: 6px;
      margin-bottom: 26px;
      gap: 6px;
    }
    .mode-tab {
      flex: 1;
      height: 60px;
      border: none;
      border-radius: 14px;
      background: transparent;
      color: var(--ink-soft);
      font-size: 22px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 4px;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.12s;
    }
    .mode-tab.active {
      background: #fff;
      color: var(--accent);
      box-shadow: 0 6px 16px -8px rgba(26, 26, 26, 0.25);
    }
    .mode-tab:active { transform: scale(0.97); }
    .mode-tab:focus-visible { outline: 4px solid var(--accent-soft); outline-offset: 2px; }

    .hint {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--accent-softer);
      border: 1px solid var(--accent-soft);
      border-radius: 18px;
      padding: 20px 24px;
      margin-bottom: 30px;
    }
    .hint-badge {
      flex-shrink: 0;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-light), var(--accent-2));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px -6px rgba(192, 108, 44, 0.6);
    }
    .hint strong { display: block; font-size: 21px; font-weight: 700; color: var(--ink); margin-bottom: 2px; }
    .hint span { font-size: 17px; color: var(--ink-soft); }

    .form { display: flex; flex-direction: column; gap: 22px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .label { font-size: 20px; font-weight: 600; color: var(--ink); padding-left: 4px; }

    .input-wrap { position: relative; }
    .input {
      width: 100%;
      height: 72px;
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 0 22px 0 60px;
      font-size: 22px;
      font-family: inherit;
      color: var(--ink);
      background: var(--input-bg);
      transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
    }
    .input::placeholder { color: var(--ink-faint); }
    .input:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 5px var(--accent-soft);
    }
    .input-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-faint);
      pointer-events: none;
      transition: color 0.18s;
      z-index: 1;
    }
    .input:focus ~ .input-icon { color: var(--accent); }

    .code-row { display: flex; gap: 14px; }
    .code-row .input-wrap { flex: 1; }

    .code-btn {
      flex-shrink: 0;
      height: 72px;
      min-width: 160px;
      border: 2px solid var(--accent);
      border-radius: 16px;
      background: #fff;
      color: var(--accent);
      font-size: 20px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      padding: 0 18px;
      transition: background 0.18s, color 0.18s, transform 0.12s, border-color 0.18s;
    }
    .code-btn:hover { background: var(--accent); color: #fff; }
    .code-btn:active { transform: scale(0.96); }
    .code-btn:disabled {
      border-color: var(--line);
      color: var(--ink-faint);
      background: var(--inactive-bg);
      cursor: not-allowed;
    }
    .code-btn:focus-visible { outline: 4px solid var(--accent-soft); outline-offset: 2px; }

    .btn-login {
      margin-top: 10px;
      height: 80px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent-2) 100%);
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 6px;
      font-family: inherit;
      cursor: pointer;
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.28),
        0 14px 30px -12px rgba(192, 108, 44, 0.65);
      transition: transform 0.12s, box-shadow 0.18s, opacity 0.18s;
    }
    .btn-login:hover {
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.28),
        0 20px 38px -12px rgba(192, 108, 44, 0.7);
    }
    .btn-login:active { transform: scale(0.97); }
    .btn-login:disabled { opacity: 0.6; cursor: wait; }
    .btn-login:focus-visible { outline: 4px solid var(--accent-soft); outline-offset: 3px; }

    .divider {
      display: flex;
      align-items: center;
      gap: 18px;
      margin: 30px 0 22px;
      color: var(--ink-faint);
      font-size: 17px;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .social { display: flex; gap: 16px; }
    .social-btn {
      flex: 1;
      height: 72px;
      border: 2px solid var(--line);
      border-radius: 16px;
      background: var(--input-bg);
      color: var(--ink);
      font-size: 20px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      transition: border-color 0.18s, background 0.18s, transform 0.12s, box-shadow 0.18s;
    }
    .social-btn:hover {
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 10px 22px -14px rgba(26, 26, 26, 0.3);
    }
    .social-btn:active { transform: scale(0.97); }
    .social-btn:focus-visible { outline: 4px solid var(--accent-soft); outline-offset: 2px; }

    .social-icon {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .social-icon.wechat { background: #07C160; }
    .social-icon.qq { background: #12B7F5; }

    .guide {
      margin-top: 26px;
      background: var(--accent-softer);
      border: 1px solid var(--accent-soft);
      border-radius: 20px;
      padding: 26px 28px;
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .guide-icon {
      flex-shrink: 0;
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent-light), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 18px -8px rgba(192, 108, 44, 0.6);
    }
    .guide-body { flex: 1; }
    .guide-body h3 { font-size: 22px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
    .guide-body p { font-size: 17px; color: var(--ink-soft); line-height: 1.5; }

    .guide-link {
      flex-shrink: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      padding: 12px 8px;
      white-space: nowrap;
      transition: transform 0.12s;
    }
    .guide-link:active { transform: scale(0.94); }

    .legal {
      margin-top: 28px;
      text-align: center;
      font-size: 17px;
      color: var(--ink-soft);
      line-height: 1.8;
    }
    .legal a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
      padding: 4px 2px;
      display: inline-block;
      transition: transform 0.12s;
    }
    .legal a:active { transform: scale(0.95); }
    .legal-sep { margin: 0 10px; color: var(--ink-faint); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%) translateY(40px);
      background: var(--ink);
      color: #fff;
      font-size: 20px;
      padding: 20px 36px;
      border-radius: 18px;
      box-shadow: 0 16px 40px -12px rgba(26, 26, 26, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .role-select { display: none; }
    .role-select.show { display: block; animation: roleIn .4s ease; }
    @keyframes roleIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .role-title { font-size: 34px; font-weight: 800; text-align: center; margin-bottom: 10px; color: var(--ink); }
    .role-subtitle { font-size: 18px; color: var(--ink-soft); text-align: center; margin-bottom: 36px; }
    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .role-card { position: relative; overflow: hidden; height: 280px; border: 2px solid var(--line); border-radius: 24px; background: linear-gradient(165deg, #fff 60%, var(--accent-softer)); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: border-color .25s, box-shadow .25s, transform .2s; box-shadow: 0 8px 24px -12px rgba(26,26,26,.12), inset 0 1px 0 rgba(255,255,255,.6); font-family: inherit; padding: 24px; border: none; }
    .role-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, var(--accent-light), var(--accent-2)); }
    .role-card::after { content: ''; position: absolute; bottom: -40px; right: -40px; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, rgba(192,108,44,.1) 0%, transparent 70%); transition: transform .4s; }
    .role-card:hover::after { transform: scale(1.8); }
    .role-card:hover { border-color: var(--accent); box-shadow: 0 20px 40px -16px rgba(192,108,44,.28), inset 0 1px 0 rgba(255,255,255,.7); transform: translateY(-5px); }
    .role-card:active { transform: scale(.97); }
    .role-card .role-icon { font-size: 80px; filter: drop-shadow(0 6px 12px rgba(192,108,44,.18)); transition: transform .3s; }
    .role-card:hover .role-icon { transform: scale(1.08); }
    .role-card .role-name { font-size: 28px; font-weight: 700; color: var(--ink); }
    .role-card .role-desc { font-size: 17px; color: var(--ink-soft); text-align: center; line-height: 1.5; }

    @media (max-width: 640px) {
      .card { padding: 44px 22px 34px; }
      .brand h1 { font-size: 30px; }
      .brand .desc { font-size: 17px; }
      .btn-login { letter-spacing: 4px; }
      .guide { flex-wrap: wrap; }
      .guide-link { width: 100%; text-align: center; }
      .read-btn { top: 16px; right: 16px; width: 50px; height: 50px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      .btn-login:active, .code-btn:active, .guide-link:active, .legal a:active, .mode-tab:active { transform: none; }
      .read-btn.reading { animation: none; }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card" aria-labelledby="brandTitle">

      <button class="read-btn" type="button" id="readBtn"
        aria-label="朗读页面所有文字，再次点击停止朗读">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
      </button>

      <header class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 84 84" width="84" height="84">
            <defs>
              <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#D4792E"/>
                <stop offset="1" stop-color="#A85A1E"/>
              </linearGradient>
            </defs>
            <circle cx="42" cy="42" r="40" fill="url(#lg)"/>
            <rect x="21" y="39" width="5" height="6" rx="2.5" fill="#fff"/>
            <rect x="39.5" y="29" width="5" height="26" rx="2.5" fill="#fff"/>
            <rect x="58" y="35" width="5" height="14" rx="2.5" fill="#fff"/>
          </svg>
        </div>
        <p class="kicker">让沉默不再是终点</p>
        <h1 id="brandTitle">拾起每一个<em>想说的</em>瞬间，<br>重新与世界对话。</h1>
        <p class="desc">拾言 ReVoice 是为失语症朋友打造的意图重建沟通助手——通过眼动、触点与图像，把心中所想，温柔地变成一句话。</p>
      </header>

      <div class="mode-switch" role="tablist" aria-label="选择登录或注册">
        <button class="mode-tab active" role="tab" aria-selected="true" data-mode="login">登 录</button>
        <button class="mode-tab" role="tab" aria-selected="false" data-mode="register">注 册</button>
      </div>

      <div class="hint" role="note" aria-label="模式说明">
        <div class="hint-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div>
          <strong id="hintTitle">登入即注册</strong>
          <span id="hintSub">首次到来，将自动为您创建账户</span>
        </div>
      </div>

      <form class="form" id="loginForm" novalidate>

        <div class="field">
          <label class="label" for="phone">手机号</label>
          <div class="input-wrap">
            <input class="input" type="tel" id="phone" name="phone"
              inputmode="numeric" autocomplete="tel"
              placeholder="请输入手机号" maxlength="11" required
              aria-label="手机号输入框，请输入11位手机号码">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="2" width="12" height="20" rx="3"/>
                <line x1="12" y1="18" x2="12" y2="18"/>
              </svg>
            </span>
          </div>
        </div>

        <div class="field">
          <label class="label" for="code">验证码</label>
          <div class="code-row">
            <div class="input-wrap">
              <input class="input" type="text" id="code" name="code"
                inputmode="numeric" autocomplete="one-time-code"
                placeholder="请输入验证码" maxlength="6" required
                aria-label="验证码输入框，请输入6位短信验证码">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="5" width="18" height="14" rx="2"/>
                  <polyline points="3 7 12 13 21 7"/>
                </svg>
              </span>
            </div>
            <button class="code-btn" type="button" id="codeBtn"
              aria-label="获取验证码，点击后向手机发送短信验证码">获取验证码</button>
          </div>
        </div>

        <button class="btn-login" type="submit" id="loginBtn"
          aria-label="登录按钮，点击后登入或自动注册拾言">登 录</button>

      </form>

      <div class="divider" id="dividerText">或使用以下方式登录</div>

      <div class="social" id="social">
        <button class="social-btn" type="button" id="wechatBtn"
          aria-label="微信登录，点击使用微信扫码登录"
          onclick="showToast('正在使用微信登录…')">
          <span class="social-icon wechat" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M9 4C4.58 4 1 7.13 1 11c0 1.9.86 3.62 2.27 4.87L2 19l3.3-1.7c1.16.36 2.4.55 3.7.55.36 0 .71-.02 1.06-.05-.04-.27-.06-.53-.06-.8 0-3.31 3.13-6 7-6 .26 0 .51.01.76.04C17.5 6.27 13.5 4 9 4z"/>
              <circle cx="6.5" cy="10" r="1" fill="#fff"/>
              <circle cx="11.5" cy="10" r="1" fill="#fff"/>
              <path d="M23 14.5c0-2.76-2.69-5-6-5s-6 2.24-6 5 2.69 5 6 5c.74 0 1.44-.1 2.08-.28L21 20l-.5-2.5C22 16.5 23 15.6 23 14.5z"/>
              <circle cx="15" cy="13.5" r=".8" fill="#fff"/>
              <circle cx="19" cy="13.5" r=".8" fill="#fff"/>
            </svg>
          </span>
          <span>微信登录</span>
        </button>
        <button class="social-btn" type="button" id="qqBtn"
          aria-label="QQ登录，点击使用QQ扫码登录"
          onclick="showToast('正在使用 QQ 登录…')">
          <span class="social-icon qq" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <ellipse cx="12" cy="10" rx="7" ry="7.5"/>
              <circle cx="9" cy="8.5" r="1.4" fill="#fff"/>
              <circle cx="15" cy="8.5" r="1.4" fill="#fff"/>
              <path d="M8.5 13c1 1 2.2 1.5 3.5 1.5s2.5-.5 3.5-1.5" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
              <ellipse cx="12" cy="20" rx="4.5" ry="2"/>
            </svg>
          </span>
          <span>QQ 登录</span>
        </button>
      </div>

      <div class="guide">
        <div class="guide-icon" aria-hidden="true">
          <svg viewBox="0 0 28 28" width="32" height="32">
            <rect x="4" y="12" width="4" height="4" rx="2" fill="#fff"/>
            <rect x="12" y="7" width="4" height="14" rx="2" fill="#fff"/>
            <rect x="20" y="10" width="4" height="8" rx="2" fill="#fff"/>
          </svg>
        </div>
        <div class="guide-body">
          <h3>第一次使用拾言？</h3>
          <p>我们为你准备了 3 分钟引导，帮助你设定专属沟通方式。</p>
        </div>
        <a class="guide-link" href="#"
          aria-label="开始引导，3分钟设定专属沟通方式"
          onclick="showToast('即将进入引导…');return false;">开始引导 →</a>
      </div>

      <footer class="legal">
        <span id="legalLead">登录即代表你同意</span>
        <a href="#" aria-label="打开用户协议"
          onclick="showToast('打开用户协议');return false;">《用户协议》</a>
        <span>与</span>
        <a href="#" aria-label="打开隐私政策"
          onclick="showToast('打开隐私政策');return false;">《隐私政策》</a>
        <span class="legal-sep">·</span>
        <span>遇到困难？</span>
        <a href="#" aria-label="联系陪伴助手"
          onclick="showToast('正在联系陪伴助手…');return false;">联系陪伴助手</a>
      </footer>

      <div class="role-select" id="roleSelect">
        <h2 class="role-title">请选择您的身份</h2>
        <p class="role-subtitle">登录成功，请选择进入哪个端</p>
        <div class="role-grid">
          <button class="role-card" onclick="window.location.href='主界面.html'">
            <span class="role-icon">🗣️</span>
            <span class="role-name">患者端</span>
            <span class="role-desc">辅助沟通<br>表达心中所想</span>
          </button>
          <button class="role-card" onclick="window.location.href='家属端.html'">
            <span class="role-icon">👨‍👩‍👦</span>
            <span class="role-name">家属端</span>
            <span class="role-desc">接收患者消息<br>远程关怀守护</span>
          </button>
        </div>
      </div>

    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const form = document.getElementById('loginForm');
    const codeBtn = document.getElementById('codeBtn');
    const loginBtn = document.getElementById('loginBtn');
    const readBtn = document.getElementById('readBtn');
    const toast = document.getElementById('toast');
    const tabs = document.querySelectorAll('.mode-tab');
    const social = document.getElementById('social');
    const dividerText = document.getElementById('dividerText');
    const hintTitle = document.getElementById('hintTitle');
    const hintSub = document.getElementById('hintSub');
    let toastTimer = null;
    let codeTimer = null;
    let speaking = false;
    let currentMode = 'login';

    const modes = {
      login: {
        hintTitle: '登入即注册',
        hintSub: '首次到来，将自动为您创建账户',
        btnText: '登 录',
        btnAria: '登录按钮，点击后登入或自动注册拾言',
        divider: '或使用以下方式登录',
        legalLead: '登录即代表你同意',
        loading: '正在进入…',
        docTitle: '拾言 ReVoice · 登入',
        success: '登入成功，欢迎来到拾言 ReVoice'
      },
      register: {
        hintTitle: '注册即创建',
        hintSub: '验证手机号，即可建立您的账户',
        btnText: '注 册',
        btnAria: '注册按钮，点击后验证手机号并创建账户',
        divider: '',
        legalLead: '注册即代表你同意',
        loading: '正在创建…',
        docTitle: '拾言 ReVoice · 注册',
        success: '注册成功，欢迎来到拾言 ReVoice'
      }
    };

    function applyMode(mode) {
      const m = modes[mode];
      currentMode = mode;
      tabs.forEach(t => {
        const active = t.dataset.mode === mode;
        t.classList.toggle('active', active);
        t.setAttribute('aria-selected', String(active));
      });
      hintTitle.textContent = m.hintTitle;
      hintSub.textContent = m.hintSub;
      loginBtn.textContent = m.btnText;
      loginBtn.setAttribute('aria-label', m.btnAria);
      document.getElementById('legalLead').textContent = m.legalLead;
      document.title = m.docTitle;
      const hintEl = document.querySelector('.hint');
      const guideEl = document.querySelector('.guide');
      if (mode === 'login') {
        dividerText.style.display = '';
        social.style.display = '';
        hintEl.style.display = 'none';
        guideEl.style.display = 'none';
      } else {
        dividerText.style.display = 'none';
        social.style.display = 'none';
        hintEl.style.display = '';
        guideEl.style.display = '';
      }
      if (speaking) {
        speechSynthesis.cancel();
        speaking = false;
        readBtn.classList.remove('reading');
      }
    }

    tabs.forEach(t => t.addEventListener('click', () => applyMode(t.dataset.mode)));

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function getReadText() {
      const base = '拾言 ReVoice。让沉默不再是终点。拾起每一个想说的瞬间，重新与世界对话。'
        + '拾言 ReVoice 是为失语症朋友打造的意图重建沟通助手，通过眼动、触点与图像，把心中所想温柔地变成一句话。';
      if (currentMode === 'register') {
        return base + '注册即创建，验证手机号即可建立您的账户。'
          + '请输入手机号，获取验证码并输入，然后点击注册。'
          + '第一次使用拾言？我们为你准备了 3 分钟引导，帮助你设定专属沟通方式。';
      }
      return base + '请输入手机号，获取验证码并输入，然后点击登录。'
        + '也可以使用微信或 QQ 登录。';
    }

    readBtn.addEventListener('click', () => {
      if (!('speechSynthesis' in window)) {
        showToast('当前浏览器不支持语音朗读');
        return;
      }
      if (speaking) {
        speechSynthesis.cancel();
        speaking = false;
        readBtn.classList.remove('reading');
        return;
      }
      const u = new SpeechSynthesisUtterance(getReadText());
      u.lang = 'zh-CN';
      u.rate = 0.92;
      u.pitch = 1;
      u.onend = () => { speaking = false; readBtn.classList.remove('reading'); };
      u.onerror = () => { speaking = false; readBtn.classList.remove('reading'); };
      speechSynthesis.speak(u);
      speaking = true;
      readBtn.classList.add('reading');
    });

    codeBtn.addEventListener('click', () => {
      const phone = document.getElementById('phone').value.trim();
      if (!/^1\d{10}$/.test(phone)) {
        showToast('请先输入正确的 11 位手机号');
        document.getElementById('phone').focus();
        return;
      }
      let left = 60;
      codeBtn.disabled = true;
      codeBtn.textContent = left + 's 后重发';
      showToast('验证码已发送，请查收短信');
      codeTimer = setInterval(() => {
        left--;
        if (left <= 0) {
          clearInterval(codeTimer);
          codeBtn.disabled = false;
          codeBtn.textContent = '获取验证码';
        } else {
          codeBtn.textContent = left + 's 后重发';
        }
      }, 1000);
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }
      const phone = document.getElementById('phone').value.trim();
      const code = document.getElementById('code').value.trim();
      if (!/^1\d{10}$/.test(phone)) { showToast('请输入正确的 11 位手机号'); document.getElementById('phone').focus(); return; }
      if (!/^\d{6}$/.test(code)) { showToast('请输入 6 位验证码'); document.getElementById('code').focus(); return; }
      const m = modes[currentMode];
      loginBtn.disabled = true;
      loginBtn.textContent = m.loading;
      setTimeout(() => {
        loginBtn.disabled = false;
        loginBtn.textContent = m.btnText;
        document.querySelector('.form').style.display='none';
        document.querySelector('.mode-switch').style.display='none';
        document.querySelector('.hint').style.display='none';
        document.getElementById('dividerText').style.display='none';
        document.getElementById('social').style.display='none';
        document.querySelector('.guide').style.display='none';
        document.querySelector('.legal').style.display='none';
        document.getElementById('roleSelect').classList.add('show');
      }, 1200);
    });

    applyMode('login');
  </script>
</body>

</html>
